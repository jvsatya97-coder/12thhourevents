<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Orange circle background -->
  <circle cx="32" cy="32" r="32" fill="#ff6b00"/>
  <!-- Clock face (white circle) -->
  <circle cx="32" cy="32" r="22" fill="white"/>
  <!-- Clock tick marks -->
  <line x1="32" y1="12" x2="32" y2="16" stroke="#ff6b00" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="48" x2="32" y2="52" stroke="#ff6b00" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="16" y2="32" stroke="#ff6b00" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="32" x2="52" y2="32" stroke="#ff6b00" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hour hand pointing to 12 -->
  <line x1="32" y1="32" x2="32" y2="17" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute hand pointing to 12 (almost) — 11:58 look -->
  <line x1="32" y1="32" x2="25" y2="18" stroke="#ff6b00" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="2.5" fill="#1a1a2e"/>
  <!-- Star sparkle top-right -->
  <text x="46" y="20" font-size="10" fill="#ffd700">✦</text>
</svg>
